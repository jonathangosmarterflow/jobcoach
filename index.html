<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Job search assistant</title>
<style>
 body{margin:0;background:#fff;color:#1B1B1B;font:18px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif}
 main{max-width:420px;margin:0 auto;padding:56px 20px;text-align:center}
 h1{font-size:24px;margin:0 0 24px}
 .btn{display:block;width:100%;min-height:56px;line-height:56px;border:0;border-radius:12px;background:#1F6F50;color:#fff;font-size:20px;font-weight:600;text-decoration:none;cursor:pointer}
 p{margin:16px 0}
 #msg{color:#4A4A4A}
</style>
</head>
<body>
<main>
 <h1>Job search assistant</h1>
 <a class="btn" id="go" href="#" style="display:none">Open the assistant</a>
 <p id="msg">Opening...</p>
 <button class="btn" id="retry" style="display:none">Retry</button>
</main>
<script>
(function(){
  var PUBLIC = "https://mario-annual-standing-jesus.trycloudflare.com";
  var t = (location.hash || '').replace(/^#/, '');
  var go = document.getElementById('go'), msg = document.getElementById('msg'), retry = document.getElementById('retry');
  if (!/^[A-Za-z0-9_-]{20,64}$/.test(t)) { msg.textContent = 'Please use the link Jonathan sent you.'; return; }
  var seen = false; try { seen = !!localStorage.getItem('jc_seen'); localStorage.setItem('jc_seen', '1'); } catch (e) {}
  var target = PUBLIC + '/c#' + t + (seen ? '~r' : '');
  go.href = target;
  function attempt(){
    msg.textContent = 'Opening...'; retry.style.display = 'none'; go.style.display = 'none';
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctl) ctl.abort(); }, 10000);
    fetch(PUBLIC + '/healthz', {cache: 'no-store', mode: 'cors', signal: ctl ? ctl.signal : undefined})
      .then(function(r){ return r.text().then(function(x){ return r.ok && x.trim() === 'ok'; }); })
      .catch(function(){ return false; })
      .then(function(ok){
        clearTimeout(timer);
        if (ok) { go.style.display = 'block'; msg.textContent = ''; location.replace(target); }
        else { msg.textContent = "The assistant is offline right now (Jonathan's computer is asleep). Please try again later."; retry.style.display = 'block'; }
      });
  }
  retry.addEventListener('click', attempt);
  attempt();
})();
</script>
</body>
</html>
